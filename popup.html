<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 360px;
      max-height: 480px;
      overflow-y: auto;
      font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      background: #0f0f0f;
      color: #f1f1f1;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      border-bottom: 1px solid #272727;
      position: sticky;
      top: 0;
      background: #0f0f0f;
      z-index: 2;
    }
    header h1 {
      font-size: 15px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    header h1 img { width: 20px; height: 20px; }
    #count {
      font-size: 12px;
      color: #aaa;
      background: #272727;
      border-radius: 10px;
      padding: 2px 8px;
    }
    #clearAll {
      background: none;
      border: none;
      color: #3ea6ff;
      font-size: 12px;
      cursor: pointer;
      padding: 4px;
    }
    #clearAll:hover { text-decoration: underline; }
    #list { padding: 8px; }
    .empty {
      text-align: center;
      color: #888;
      font-size: 13px;
      padding: 48px 20px;
      line-height: 1.5;
    }
    .item {
      display: flex;
      gap: 10px;
      padding: 8px;
      border-radius: 8px;
      cursor: pointer;
      position: relative;
    }
    .item:hover { background: #1f1f1f; }
    .thumbWrap {
      position: relative;
      flex-shrink: 0;
      width: 120px;
      height: 68px;
      border-radius: 6px;
      overflow: hidden;
      background: #222;
    }
    .thumbWrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .bar {
      position: absolute;
      left: 0; bottom: 0;
      height: 3px;
      width: 100%;
      background: rgba(255,255,255,0.25);
    }
    .bar > div { height: 100%; background: #f03; }
    .meta { flex: 1; min-width: 0; }
    .title {
      font-size: 13px;
      font-weight: 500;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .sub {
      font-size: 11px;
      color: #aaa;
      margin-top: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .remove {
      position: absolute;
      top: 6px;
      right: 6px;
      border: none;
      background: none;
      color: #777;
      font-size: 15px;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 4px;
      visibility: hidden;
    }
    .item:hover .remove { visibility: visible; }
    .remove:hover { color: #fff; background: #333; }
    footer {
      padding: 8px 14px;
      font-size: 11px;
      color: #666;
      text-align: center;
      border-top: 1px solid #272727;
    }
  </style>
</head>
<body>
  <header>
    <h1><img src="icons/icon48.png" alt="" /> ResumeTube</h1>
    <span id="count"></span>
    <button id="clearAll" title="Remove all tracked videos">Clear all</button>
  </header>
  <div id="list"></div>
  <footer>Progress is stored locally in your browser only.</footer>
  <script src="popup.js"></script>
</body>
</html>
